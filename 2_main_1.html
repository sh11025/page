<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자 인코딩을 UTF-8(한글 지원)로 설정합니다 -->
    <meta charset="UTF-8">
    <!-- 모바일 기기 화면 크기에 맞게 자동 조절(반응형)되도록 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리랜서 마켓 UI - 모듈화 버전</title>
    
    <!-- [CSS 연결] 디자인을 꾸며줄 외부 스타일시트 파일을 불러옵니다[cite: 1] -->
    <link rel="stylesheet" href="css/2_1_style.css">
</head>
<body>

    <!-- 전체 콘텐츠를 감싸는 가장 큰 틀(박스)입니다 -->
    <div class="container">
        
        <!-- [첫 번째 파트 영역] script1.js가 쇼핑몰 사장님 데이터를 그려 넣을 빈 도화지입니다 -->
        <div id="app-1" class="app-section"></div>
        
        <!-- [두 번째 파트 영역] script2.js가 매장 운영 데이터를 그려 넣을 빈 도화지입니다 -->
        <div id="app-2" class="app-section"></div>
        
        <!-- [세 번째 파트 영역] script3.js가 예비창업가 데이터를 그려 넣을 빈 도화지입니다 -->
        <div id="app-3" class="app-section"></div>

    </div>

    <!-- [JS 연결] HTML 문서가 화면에 모두 그려진 뒤에 자바스크립트가 실행되도록 body 맨 아래에 배치합니다[cite: 1] -->
    <script src="js/2_1_script1.js"></script>
    <script src="js/2_1_script2.js"></script>
    <script src="js/2_1_script3.js"></script>
</body>
</html>
