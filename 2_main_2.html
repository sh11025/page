<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추천 서비스 섹션</title>
  <!-- CSS 연결 -->
  <link rel="stylesheet" href="css/2_2_style.css">
</head>
<body>

  <div class="main-container">
    <!-- 박스 1: 디자인 -->
    <div class="service-card" id="box-design">
      <h2 class="card-title">
        <span class="highlight orange">디자인</span>에서 놓치지 마세요
      </h2>
      <div class="item-grid" id="grid-design">
        <!-- 2_2_script1.js에서 동적 렌더링 -->
      </div>
    </div>

    <!-- 박스 2: 마케팅 -->
    <div class="service-card" id="box-marketing">
      <h2 class="card-title">
        <span class="highlight blue">마케팅</span>에서 추천해 드려요
      </h2>
      <div class="item-grid" id="grid-marketing">
        <!-- 2_2_script2.js에서 동적 렌더링 -->
      </div>
    </div>

    <!-- 박스 3: 트렌드 -->
    <div class="service-card" id="box-trend">
      <h2 class="card-title">
        <span class="highlight purple">요즘,</span> 뜨고 있어요
      </h2>
      <div class="item-grid" id="grid-trend">
        <!-- 2_2_script3.js에서 동적 렌더링 -->
      </div>
    </div>
  </div>

  <!-- JS 파일 연결 -->
  <script src="js/2_2_script1.js"></script>
  <script src="js/2_2_script2.js"></script>
  <script src="js/2_2_script3.js"></script>
</body>
</html>
